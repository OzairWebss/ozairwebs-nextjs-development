<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img"><title>A controlled retrieval journey</title><desc>Illustrative read-only request flow: request, permission check, filtered retrieval, validated answer with sources.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111311"/><stop offset="1" stop-color="#242a29"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#f79d01" stroke-width="1.6"/></marker></defs><rect width="1400" height="430" rx="28" fill="url(#bg)"/><text x="54" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#f79d01">OZAIRWEBS / ENGINEERING NOTES</text><text x="54" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" fill="#f4f1e8">A controlled retrieval journey</text><text x="54" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#cbd2cd">ILLUSTRATIVE / READ-ONLY / NO AUTONOMOUS WRITE TOOLS</text><rect x="61" y="214" width="285" height="145" rx="18" fill="#080b09"/><rect x="54" y="205" width="285" height="145" rx="18" fill="#202726" stroke="#65716d"/><rect x="54" y="205" width="285" height="7" rx="3" fill="#56635e"/><text x="76" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Request</text><text x="76" y="293" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Authenticated user</text><text x="76" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">asks a question</text><path d="M339 277 L377 277" fill="none" stroke="#f79d01" stroke-width="3" marker-end="url(#arrow)"/><rect x="391" y="214" width="285" height="145" rx="18" fill="#080b09"/><rect x="384" y="205" width="285" height="145" rx="18" fill="#202726" stroke="#65716d"/><rect x="384" y="205" width="285" height="7" rx="3" fill="#56635e"/><text x="406" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Permission</text><text x="406" y="293" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Verify identity</text><text x="406" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">and source access</text><path d="M669 277 L707 277" fill="none" stroke="#f79d01" stroke-width="3" marker-end="url(#arrow)"/><rect x="721" y="214" width="285" height="145" rx="18" fill="#080b09"/><rect x="714" y="205" width="285" height="145" rx="18" fill="#202726" stroke="#65716d"/><rect x="714" y="205" width="285" height="7" rx="3" fill="#56635e"/><text x="736" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Retrieval</text><text x="736" y="293" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Find permitted</text><text x="736" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">supporting material</text><path d="M999 277 L1037 277" fill="none" stroke="#f79d01" stroke-width="3" marker-end="url(#arrow)"/><rect x="1051" y="214" width="285" height="145" rx="18" fill="#080b09"/><rect x="1044" y="205" width="285" height="145" rx="18" fill="#202726" stroke="#65716d"/><rect x="1044" y="205" width="285" height="7" rx="3" fill="#56635e"/><text x="1066" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Response</text><text x="1066" y="293" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Validate answer</text><text x="1066" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">and show sources</text><text x="54" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#cbd2cd">Permissions govern retrieval; model output is not authorization.</text></svg>