<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img"><title>Application architecture: keep boundaries explicit</title><desc>Illustrative architecture. Browser interaction passes through server authorization before database or external API access. AI receives only access-filtered context.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111311"/><stop offset="1" stop-color="#242a29"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#f79d01" stroke-width="1.6"/></marker></defs><rect width="1400" height="720" rx="28" fill="url(#bg)"/><text x="54" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#f79d01">OZAIRWEBS / ENGINEERING NOTES</text><text x="54" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" fill="#f4f1e8">Application architecture: keep boundaries explicit</text><text x="54" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#cbd2cd">A conceptual map, not a deployed client system or performance benchmark.</text><rect x="61" y="224" width="280" height="175" rx="18" fill="#080b09"/><rect x="54" y="215" width="280" height="175" rx="18" fill="#202726" stroke="#65716d"/><rect x="54" y="215" width="280" height="7" rx="3" fill="#f79d01"/><text x="76" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Browser experience</text><text x="76" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Accessible interaction</text><text x="76" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Loading and recovery</text><text x="76" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Only permitted output</text><rect x="423" y="224" width="345" height="175" rx="18" fill="#080b09"/><rect x="416" y="215" width="345" height="175" rx="18" fill="#202726" stroke="#65716d"/><rect x="416" y="215" width="345" height="7" rx="3" fill="#f79d01"/><text x="438" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Server boundary</text><text x="438" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Validate runtime input</text><text x="438" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Session + record permission</text><text x="438" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Own business transitions</text><rect x="851" y="224" width="490" height="175" rx="18" fill="#080b09"/><rect x="844" y="215" width="490" height="175" rx="18" fill="#202726" stroke="#65716d"/><rect x="844" y="215" width="490" height="7" rx="3" fill="#f79d01"/><text x="866" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Data and integrations</text><text x="866" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Database / supported APIs</text><text x="866" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Stable identifiers + transactions</text><text x="866" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Retries, queues and reconciliation</text><path d="M334 302 L411 302" fill="none" stroke="#f79d01" stroke-width="3" marker-end="url(#arrow)"/><path d="M761 302 L839 302" fill="none" stroke="#f79d01" stroke-width="3" marker-end="url(#arrow)"/><rect x="423" y="479" width="345" height="155" rx="18" fill="#080b09"/><rect x="416" y="470" width="345" height="155" rx="18" fill="#202726" stroke="#65716d"/><rect x="416" y="470" width="345" height="7" rx="3" fill="#6db6b1"/><text x="438" y="518" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Retrieval boundary</text><text x="438" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Filter by user permissions</text><text x="438" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Approved sources + provenance</text><rect x="851" y="479" width="490" height="155" rx="18" fill="#080b09"/><rect x="844" y="470" width="490" height="155" rx="18" fill="#202726" stroke="#65716d"/><rect x="844" y="470" width="490" height="7" rx="3" fill="#6db6b1"/><text x="866" y="518" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Model adapter</text><text x="866" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Validate structured responses</text><text x="866" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Review sensitive proposed actions</text><path d="M590 390 L590 465" fill="none" stroke="#f79d01" stroke-width="3" marker-end="url(#arrow)"/><path d="M761 545 L839 545" fill="none" stroke="#f79d01" stroke-width="3" marker-end="url(#arrow)"/><text x="54" y="680" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#f79d01">A model response does not grant permission to read records or execute a tool.</text></svg>