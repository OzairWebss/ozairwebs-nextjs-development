<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img"><title>Release gate graph: evidence before deployment</title><desc>Permission checks, cache/data checks and critical user journeys feed a human release review. Deployment requires rollback and monitoring. No numerical scores or timings are asserted.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111311"/><stop offset="1" stop-color="#242a29"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#f79d01" stroke-width="1.6"/></marker></defs><rect width="1400" height="720" rx="28" fill="url(#bg)"/><text x="54" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#f79d01">OZAIRWEBS / ENGINEERING NOTES</text><text x="54" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" fill="#f4f1e8">Release gate graph: evidence before deployment</text><text x="54" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#cbd2cd">These are dependency gates, not measured speed, traffic or delivery duration.</text><rect x="61" y="216" width="355" height="135" rx="18" fill="#080b09"/><rect x="54" y="207" width="355" height="135" rx="18" fill="#202726" stroke="#65716d"/><rect x="54" y="207" width="355" height="7" rx="3" fill="#f79d01"/><text x="76" y="255" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Permission tests</text><text x="76" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Denied requests</text><text x="76" y="325" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Tenant / role boundaries</text><rect x="61" y="381" width="355" height="135" rx="18" fill="#080b09"/><rect x="54" y="372" width="355" height="135" rx="18" fill="#202726" stroke="#65716d"/><rect x="54" y="372" width="355" height="7" rx="3" fill="#f79d01"/><text x="76" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Data + cache checks</text><text x="76" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Update consistency</text><text x="76" y="490" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Private data isolation</text><rect x="61" y="546" width="355" height="135" rx="18" fill="#080b09"/><rect x="54" y="537" width="355" height="135" rx="18" fill="#202726" stroke="#65716d"/><rect x="54" y="537" width="355" height="7" rx="3" fill="#f79d01"/><text x="76" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Journey tests</text><text x="76" y="625" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Checkout / forms / API</text><text x="76" y="655" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Failure and recovery</text><rect x="532" y="344" width="330" height="175" rx="18" fill="#080b09"/><rect x="525" y="335" width="330" height="175" rx="18" fill="#202726" stroke="#65716d"/><rect x="525" y="335" width="330" height="7" rx="3" fill="#f79d01"/><text x="547" y="383" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Release review</text><text x="547" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Inspect acceptance evidence</text><text x="547" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Approve known limitations</text><text x="547" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Confirm rollback owner</text><rect x="977" y="344" width="365" height="175" rx="18" fill="#080b09"/><rect x="970" y="335" width="365" height="175" rx="18" fill="#202726" stroke="#65716d"/><rect x="970" y="335" width="365" height="7" rx="3" fill="#f79d01"/><text x="992" y="383" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#f4f1e8">Deploy and operate</text><text x="992" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Controlled release</text><text x="992" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Observe real behaviour</text><text x="992" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd2cd">Recover or roll back</text><path d="M409 274 H455 V422 H520 M409 439 H520 M409 604 H455 V422" fill="none" stroke="#f79d01" stroke-width="3" marker-end="url(#arrow)"/><path d="M855 422 L965 422" fill="none" stroke="#f79d01" stroke-width="3" marker-end="url(#arrow)"/></svg>